<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 548" role="img" aria-labelledby="mcd-arch-title mcd-arch-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="mcd-arch-title">Multi-CLI Delivery architecture</title>
      <desc id="mcd-arch-desc">A Control session drives four deterministic helper CLIs that dispatch plan, code and review roles to different headless AI-CLIs inside an isolated git worktree, parse each worker's handoff, and commit accepted work to a feature branch, bracketed by two human gates.</desc>

      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <!-- background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== trust-boundary zone (before arrows & nodes) ===== -->
      <rect x="856" y="140" width="232" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="864" y="144" width="216" height="14" rx="2" fill="#f5f5f5"/>
      <text x="972" y="154" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">ISOLATED WORKTREE · NO GIT AUTHORITY · NO REMOTE CREDS</text>

      <!-- ===== arrows (before boxes) ===== -->
      <!-- Gate 1: Human -> Control -->
      <path d="M 356,112 V 220" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Gate 2: Control -> Human (dashed return) -->
      <path d="M 404,220 V 112" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <!-- Config -> Control -->
      <path d="M 232,270 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Control -> CLIs -->
      <path d="M 480,270 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CLIs -> PLAN (dispatch, right+up) -->
      <path d="M 784,250 H 824 Q 832,250 832,242 V 218 Q 832,210 840,210 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Worker zone -> CLIs (handoff return, left+up, dashed) -->
      <path d="M 880,394 H 828 Q 820,394 820,386 V 308 Q 820,300 812,300 H 784" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- PLAN -> CODE -->
      <path d="M 972,240 V 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CODE -> REVIEW -->
      <path d="M 972,332 V 364" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CLIs -> Git (commit) -->
      <path d="M 672,328 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== nodes ===== -->
      <!-- Human -->
      <rect x="280" y="48" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="48" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="288" y="56" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.7)" stroke-width="0.8"/>
      <text x="308" y="65" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="380" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">You</text>
      <text x="380" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">owns both gates</text>

      <!-- Control (FOCAL) -->
      <rect x="280" y="220" width="200" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="220" width="200" height="100" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="288" y="230" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/>
      <text x="314" y="239" fill="#c85a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CONTROL</text>
      <text x="380" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Claude · Control</text>
      <text x="380" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">owns git · never codes</text>
      <text x="380" y="306" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">decompose · classify</text>

      <!-- Config -->
      <rect x="40" y="236" width="192" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="236" width="192" height="68" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="244" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="70" y="253" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>
      <text x="136" y="276" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono',monospace" text-anchor="middle">.aak/delivery.yml</text>
      <text x="136" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">role → cli + model</text>

      <!-- Deterministic CLIs -->
      <rect x="560" y="212" width="224" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="212" width="224" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="220" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="598" y="229" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">MCD_CORE</text>
      <text x="672" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Deterministic CLIs</text>
      <text x="672" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">preflight · workspace</text>
      <text x="672" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">dispatch · containment</text>
      <text x="672" y="312" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">tested · no hand-parse</text>

      <!-- Git -->
      <rect x="560" y="400" width="224" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="400" width="224" height="68" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
      <text x="582" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="672" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Git · feature branch</text>
      <text x="672" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">commit == reviewed</text>

      <!-- PLAN -->
      <rect x="880" y="180" width="184" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="180" width="184" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="888" y="188" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="906" y="197" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="972" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Decompose</text>
      <text x="972" y="231" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">→ task contracts</text>

      <!-- CODE -->
      <rect x="880" y="272" width="184" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="272" width="184" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="888" y="280" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="906" y="289" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
      <text x="972" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Implement</text>
      <text x="972" y="323" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">writes owned paths</text>

      <!-- REVIEW -->
      <rect x="880" y="364" width="184" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="364" width="184" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="888" y="372" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="912" y="381" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>
      <text x="972" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Independent review</text>
      <text x="972" y="415" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">different model</text>

      <!-- ===== arrow labels (on top of strokes, open canvas) ===== -->
      <rect x="296" y="154" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="163" fill="#c85a2b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GATE 1</text>
      <rect x="412" y="154" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="438" y="163" fill="#c85a2b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">GATE 2</text>
      <rect x="234" y="250" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ROLES</text>
      <rect x="488" y="250" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">INVOKES</text>
      <rect x="786" y="228" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="817" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>
      <rect x="754" y="350" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="784" y="359" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>
      <rect x="982" y="340" width="78" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1021" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">REVIEW ≠ CODE</text>
      <rect x="680" y="356" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="490" x2="1088" y2="490" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="503" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="138" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">Control · human gates</text>
      <rect x="352" y="503" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="370" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">CLI · headless worker</text>
      <rect x="576" y="503" width="12" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="594" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">config · git store</text>
      <rect x="760" y="503" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="778" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">trust boundary · worktree</text>
    </svg>
